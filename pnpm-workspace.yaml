packages:
  - apps/*
  - packages/*
# React Native's tooling (metro/expo) resolves some package files outside the
# "exports" map (e.g. react-native/rn-get-polyfills), which requires a flat
# node_modules layout under pnpm.
nodeLinker: hoisted
minimumReleaseAgeExclude:
  - babel-preset-expo@57.0.10
  - expo-constants@57.0.17
  - expo-notifications@57.0.16
  - '@expo/cli@57.0.21'
  - '@expo/fingerprint@0.20.12'
  - '@expo/metro-runtime@57.0.15'
  - '@expo/router-server@57.0.9'
  - expo-asset@57.0.16
  - expo-font@57.0.3
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo@57.0.19
  - '@expo/ui@57.0.15'
  - expo-linking@57.0.9
  - expo-router@57.0.18
# Dependencies allowed to run install scripts (pnpm 11.25 "allowBuilds" map;
# replaces the deprecated onlyBuiltDependencies list).
allowBuilds:
  "@swc/core": true
  core-js: true
  esbuild: true
  expo-modules-core: true
  simple-git-hooks: true
